<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appointment Desk</title><link rel="stylesheet" href="style.css"></head><body><main><header><p>WEB SERVICE DEMO</p><h1>Appointment Desk</h1><p>Book a service, check its schedule, and cancel appointments.</p><p class="notice">Local demonstration. No sign-in or access controls. Use synthetic names only.</p></header><div class="layout"><section><h2>New appointment</h2><form id="booking"><label><span id="service-label">Service</span><select id="service" aria-labelledby="service-label" required></select></label><label>Customer name<input id="customer" maxlength="100" required placeholder="Demo customer"></label><label>Start time (your local time)<input id="start" type="datetime-local" required></label><label>Duration in minutes<input id="minutes" type="number" min="15" max="240" value="30" required></label><button id="submit">Book appointment</button></form><p id="message" role="status" aria-live="polite"></p></section><section><div class="heading"><h2>Appointments</h2><button id="refresh" type="button">Refresh</button></div><div id="appointments" aria-live="polite"></div></section></div><footer>ASP.NET Core Web API · JSON over HTTP · Persistent file storage</footer></main><script src="app.js" defer></script></body></html>
