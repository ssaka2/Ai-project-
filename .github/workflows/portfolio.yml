name: Portfolio tests
on:
  push:
    paths: ['portfolio/**', '.github/workflows/portfolio.yml']
  pull_request:
    paths: ['portfolio/**', '.github/workflows/portfolio.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test every portfolio project
        run: python portfolio/run_tests.py
      - name: Run sample analytics pipeline
        run: |
          python portfolio/airport-analytics/pipeline.py portfolio/airport-analytics/sample_flights.csv --db :memory:
      - name: Verify document retrieval demo
        working-directory: portfolio/local-knowledge-search
        run: |
          python search.py index documents
          python search.py search "deployment readiness rollback"
          python search.py evaluate cases.json --limit 1
      - name: Generate agent evaluation reports
        working-directory: portfolio/agent-evaluation-lab
        run: python evaluate.py examples/suite.jsonl examples/candidate.jsonl --baseline examples/baseline.jsonl --output output
      - uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-python-${{ matrix.python-version }}
          path: portfolio/agent-evaluation-lab/output/
