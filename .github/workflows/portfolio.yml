name: Portfolio tests
on:
  push:
    paths: ['portfolio/**', '.github/workflows/portfolio.yml']
  pull_request:
    paths: ['portfolio/**', '.github/workflows/portfolio.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s portfolio/inventory-ledger -v
      - run: python -m unittest discover -s portfolio/airport-analytics -v
      - run: python portfolio/airport-analytics/pipeline.py portfolio/airport-analytics/sample_flights.csv --db :memory:
