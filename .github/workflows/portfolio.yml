name: Portfolio tests
on:
  push:
    paths: ['portfolio/**', '.github/workflows/portfolio.yml']
  pull_request:
    paths: ['portfolio/**', '.github/workflows/portfolio.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python project dependencies
        run: |
          python -m pip install -r portfolio/mcp-knowledge-tools/requirements.txt -r portfolio/ai-response-contract-lab/requirements.txt
          python -m pip check
      - name: Run MCP client demo
        run: python portfolio/mcp-knowledge-tools/demo.py
      - name: Run structured-output and agent-memory demos
        run: |
          python portfolio/ai-response-contract-lab/contracts.py --schema portfolio/ai-response-contract-lab/schema.json --response portfolio/ai-response-contract-lab/response.json
          python portfolio/agent-memory-store/memory_store.py demo
      - name: Test every portfolio project
        run: python portfolio/run_tests.py
      - name: Run sample analytics pipeline
        run: |
          python portfolio/airport-analytics/pipeline.py portfolio/airport-analytics/sample_flights.csv --db :memory:
      - name: Verify document retrieval demo
        working-directory: portfolio/local-knowledge-search
        run: |
          python search.py index documents
          python search.py search "deployment readiness rollback"
          python search.py evaluate cases.json --limit 1
      - name: Generate agent evaluation reports
        working-directory: portfolio/agent-evaluation-lab
        run: python evaluate.py examples/suite.jsonl examples/candidate.jsonl --baseline examples/baseline.jsonl --output output
      - uses: actions/upload-artifact@v7
        with:
          name: agent-evaluation-python-${{ matrix.python-version }}
          path: portfolio/agent-evaluation-lab/output/
  support-ticket-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build API and verify HTTP behavior and restart persistence
        run: python portfolio/support-ticket-api/verify_api.py
  signed-webhook-receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify signed requests and duplicate handling
        working-directory: portfolio/signed-webhook-receiver
        run: |
          npm test
          npm run demo
  ollama-request-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify gateway using a local mock Ollama endpoint
        working-directory: portfolio/ollama-request-gateway
        run: |
          npm test
          npm run demo

  ai-engineering-web-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check browser evaluator syntax and rules
        working-directory: portfolio/ai-engineering-web-lab
        run: |
          node --check dist/app.js
          node --test test-evaluate.mjs

  go-health-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - name: Test concurrency, build, and run the local demo
        working-directory: portfolio/go-health-probe
        run: |
          go vet ./...
          go test -race -v ./...
          go build -trimpath -o healthprobe .
          ./healthprobe -demo
      - uses: actions/upload-artifact@v7
        with:
          name: go-health-probe-linux
          path: portfolio/go-health-probe/healthprobe
  rust-log-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Install verified stable Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Test, build, and verify report output
        working-directory: portfolio/rust-log-metrics
        run: |
          cargo +1.98.1 test --locked
          cargo +1.98.1 build --release --locked
          ./target/release/log-metrics --demo > /tmp/log-metrics-demo.json
          ./target/release/log-metrics sample.tsv > /tmp/log-metrics-sample.json
          python3 -c 'import json; a=json.load(open("/tmp/log-metrics-demo.json")); b=json.load(open("/tmp/log-metrics-sample.json")); assert a==b; assert a["services"][0]["server_errors"]==1; assert a["services"][0]["p95_ms"]==100'
      - uses: actions/upload-artifact@v7
        with:
          name: rust-log-metrics-linux
          path: portfolio/rust-log-metrics/target/release/log-metrics
