name: Portfolio tests
on:
  push:
    paths: ['portfolio/**', '.github/workflows/portfolio.yml']
  pull_request:
    paths: ['portfolio/**', '.github/workflows/portfolio.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python project dependencies
        run: |
          python -m pip install -r portfolio/mcp-knowledge-tools/requirements.txt -r portfolio/ai-response-contract-lab/requirements.txt
          python -m pip check
      - name: Run MCP client demo
        run: python portfolio/mcp-knowledge-tools/demo.py
      - name: Run structured-output and agent-memory demos
        run: |
          python portfolio/ai-response-contract-lab/contracts.py --schema portfolio/ai-response-contract-lab/schema.json --response portfolio/ai-response-contract-lab/response.json
          python portfolio/agent-memory-store/memory_store.py demo
      - name: Test every portfolio project
        run: python portfolio/run_tests.py
      - name: Run sample analytics pipeline
        run: |
          python portfolio/airport-analytics/pipeline.py portfolio/airport-analytics/sample_flights.csv --db :memory:
      - name: Verify document retrieval demo
        working-directory: portfolio/local-knowledge-search
        run: |
          python search.py index documents
          python search.py search "deployment readiness rollback"
          python search.py evaluate cases.json --limit 1
      - name: Generate agent evaluation reports
        working-directory: portfolio/agent-evaluation-lab
        run: python evaluate.py examples/suite.jsonl examples/candidate.jsonl --baseline examples/baseline.jsonl --output output
      - uses: actions/upload-artifact@v7
        with:
          name: agent-evaluation-python-${{ matrix.python-version }}
          path: portfolio/agent-evaluation-lab/output/
  support-ticket-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build API and verify HTTP behavior and restart persistence
        run: python portfolio/support-ticket-api/verify_api.py
  signed-webhook-receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify signed requests and duplicate handling
        working-directory: portfolio/signed-webhook-receiver
        run: |
          npm test
          npm run demo
  ollama-request-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify gateway using a local mock Ollama endpoint
        working-directory: portfolio/ollama-request-gateway
        run: |
          npm test
          npm run demo
