name: Build and test
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore AiCareerDesk.slnx
      - run: dotnet tool restore
      - name: Verify committed migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project src/AiCareerDesk.Web
      - run: dotnet build AiCareerDesk.slnx --configuration Release --no-restore
      - name: Install Chromium for browser verification
        run: pwsh tests/AiCareerDesk.Web.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Audit dependency advisories
        shell: bash
        run: |
          mkdir -p TestResults
          dotnet list AiCareerDesk.slnx package --vulnerable --include-transitive --format json > TestResults/nuget-audit.json
      - name: Verify dependency audit
        shell: python
        run: |
          import json
          from pathlib import Path
          report = json.loads(Path("TestResults/nuget-audit.json").read_text())
          findings = []
          for project in report.get("projects", []):
              for framework in project.get("frameworks", []):
                  for group in ("topLevelPackages", "transitivePackages"):
                      for package in framework.get(group, []):
                          if package.get("vulnerabilities"):
                              findings.append(package["id"])
          print("Dependency advisory findings:", len(findings))
          if findings:
              raise SystemExit("Vulnerable packages: " + ", ".join(sorted(set(findings))))
          if any(item.get("level", "").lower() == "error" for item in report.get("logs", [])):
              raise SystemExit("Dependency audit reported an error.")
      - name: Start disposable SQL Server
        shell: bash
        run: |
          sql_test_password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$sql_test_password"
          docker run -d --name career-sql -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$sql_test_password" -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          echo "TEST_SQL_CONNECTION=Server=localhost,1433;Database=AiCareerDeskTests;User Id=sa;Password=$sql_test_password;Encrypt=true;TrustServerCertificate=true" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            if docker exec career-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$sql_test_password" -C -Q "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready."
          exit 1
      - name: Start local SMTP inbox
        run: |
          docker run -d --name career-mailpit -p 127.0.0.1:1025:1025 -p 127.0.0.1:8025:8025 axllent/mailpit:v1.27
          curl --retry 20 --retry-all-errors --retry-delay 1 --fail --silent http://127.0.0.1:8025/api/v1/messages > /dev/null
      - name: Run service, SQL Server, and browser verification
        env:
          RUN_BROWSER_TESTS: "true"
        run: dotnet test AiCareerDesk.slnx --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Verify Docker deployment and restart
        run: |
          docker rm -f career-sql career-mailpit
          python scripts/setup.py
          docker compose -p career-smoke up --build -d --wait --wait-timeout 180 web
          curl --fail --silent http://127.0.0.1:8080/health/ready
          curl --fail --silent http://127.0.0.1:8080/Identity/Account/Login > /dev/null
          docker compose -p career-smoke restart web
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose -p career-smoke logs --tail 80 web migrate || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
      - name: Stop disposable database
        if: always()
        run: |
          docker rm -f career-sql career-mailpit || true
          if test -f .env; then docker compose -p career-smoke down -v; fi
