version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      microsoft-dotnet:
        patterns:
          - Microsoft.AspNetCore.*
          - Microsoft.EntityFrameworkCore.*
        update-types:
          - minor
          - patch
